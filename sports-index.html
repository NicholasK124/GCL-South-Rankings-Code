<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCL South Football</title>
    <link rel="stylesheet" href="sports-styles.css" />
  </head>
  <body>
    <header><h1>GCL South Football Stats</h1></header>

    <table>
      GCL South Football Rankings
      <thead>
        <tr>
          <th>Teams</th>
          <th>Wins</th>
          <th>Losses</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr class="elder">
          <td>Elder Panthers</td>
          <td id="elderAddWin">0</td>
          <td id="elderAddLoss">0</td>
          <td>
            <button id="elderWin">Add 1 Win</button
            ><button id="elderLoss">Add 1 Loss</button>
          </td>
        </tr>
        <tr class="stx">
          <td>St. Xavier Bombers</td>
          <td id="stxAddWin">0</td>
          <td id="stxAddLoss">0</td>
          <td>
            <button id="stxWin">Add 1 Win</button
            ><button id="stxLoss">Add 1 Loss</button>
          </td>
        </tr>
        <tr class="lasalle">
          <td>LaSalle Lancers</td>
          <td id="lasalleAddWin">0</td>
          <td id="lasalleAddLoss">0</td>
          <td>
            <button id="lasalleWin">Add 1 Win</button>
            <button id="lasalleLoss">Add 1 Loss</button>
          </td>
        </tr>
        <tr class="moe">
          <td>Moeller Crusaders</td>
          <td id="moeAddWin">0</td>
          <td id="moeAddLoss">0</td>
          <td>
            <button id="moeWin">Add 1 Win</button
            ><button id="moeLoss">Add 1 Loss</button>
          </td>
        </tr>
      </tbody>
    </table>
    <button id="eraseRankings"><h3>Erase Rankings</h3></button>

    <script src="sports-script.js"></script>
  </body>
</html>
